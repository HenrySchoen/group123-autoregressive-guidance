# training
train:
  epochs: 30
  lr: 1e-3
  batch_size: 32

# transformer
transformer:
  n_layers: 6
  d_model: 256
  n_heads: 4
  dropout: 0.2

# mlp
mlp:
  context: 3
  embed_dim: 32
  hidden_dim: 256
  dropout: 0.1

# sampling
sample:
  num: 256
  temperature: 1.0
  seed: 0

# classifier-free guidance
cfg:
  p_drop: 0.15
  target_family: AcyP
  w_values: [0, 1, 2, 4, 8]
